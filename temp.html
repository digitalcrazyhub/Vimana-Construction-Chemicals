<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* =========================================================
   VIMANA — Design Tokens & Core Variables
   ========================================================= */
:root {
    --vmn-blue: #255aa8;
    --vmn-blue-600: #1e4a8e;
    --vmn-blue-300: #4a8fe0;
    --vmn-green: #18a75a;
    --vmn-green-600: #128a49;
    --vmn-green-300: #4bd08a;
    --vmn-bg: #ffffff;
    --vmn-bg-soft: #f5f7fb;
    --vmn-bg-tint: #eef3fa;
    --vmn-ink: #0f172a;
    --vmn-ink-2: #1f2a44;
    --vmn-muted: #5b6478;
    --vmn-line: #e6ebf3;
    --vmn-grad: linear-gradient(135deg, var(--vmn-blue) 0%, var(--vmn-green) 100%);
    --vmn-grad-soft: linear-gradient(135deg, rgba(37, 90, 168, 0.08), rgba(24, 167, 90, 0.08));
    --vmn-grad-light: linear-gradient(135deg, #7cb8ff 0%, #6bf0aa 100%);
    --vmn-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 2px 6px rgba(15, 23, 42, 0.04);
    --vmn-shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.04);
    --vmn-shadow-lg: 0 24px 60px -20px rgba(37, 90, 168, 0.25), 0 12px 24px -12px rgba(24, 167, 90, 0.12);
    --vmn-radius: 18px;
    --vmn-radius-lg: 28px;
    --vmn-font: "Plus Jakarta Sans", "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --vmn-container-width: 1200px;
    --vmn-nav-height: 76px;
}


.vmn-container {
    width: min(100% - 32px, var(--vmn-container-width));
    margin-inline: auto;
}

/* ---------- Typography & Utility Utilities ---------- */
.vmn-heading-lg {
    font-size: clamp(1.8rem, 3.4vw, 2.75rem);
    line-height: 1.18;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin: 0 0 14px;
    color: var(--vmn-ink);
}

.vmn-heading-lg--light {
    color: #ffffff;
}

.vmn-text-lead {
    color: var(--vmn-muted);
    font-size: clamp(0.98rem, 1.2vw, 1.08rem);
    max-width: 62ch;
    margin: 0 auto;
}

.vmn-tagline {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--vmn-blue);
    padding: 6px 14px;
    background: var(--vmn-grad-soft);
    border-radius: 999px;
    margin-bottom: 14px;
}

.vmn-tagline--light {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.vmn-text-gradient {
    background: var(--vmn-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.vmn-text-gradient-light {
    background: var(--vmn-grad-light);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* ---------- Buttons ---------- */
.vmn-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
    will-change: transform;
}

.vmn-btn--primary {
    background: var(--vmn-grad);
    color: #ffffff;
    box-shadow: 0 10px 24px -10px rgba(37, 90, 168, 0.6);
}

.vmn-btn--primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 34px -12px rgba(37, 90, 168, 0.7);
}

.vmn-btn--light {
    background: #ffffff;
    color: var(--vmn-blue);
}

.vmn-btn--light:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 34px -12px rgba(0, 0, 0, 0.3);
}

.vmn-btn--outline {
    background: transparent;
    color: #ffffff;
    border-color: rgba(255, 255, 255, 0.5);
}

.vmn-btn--outline:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-3px);
}

/* ---------- Glass Card ---------- */
.vmn-glass-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: var(--vmn-radius);
    box-shadow: var(--vmn-shadow-md);
}

/* =========================================================
   1. HERO SECTION
   ========================================================= */
.vmn-hero {
    position: relative;
    min-height: 60vh;
    display: flex;
    align-items: center;
    color: #ffffff;
    overflow: hidden;
    padding-top: var(--vmn-nav-height);
}

.vmn-hero__background {
    position: absolute;
    inset: 0;
    background: url("/assets/hero-1.jpg") center/cover no-repeat;
    transform: scale(1.05);
    animation: vmnHeroZoom 20s ease-in-out infinite alternate;
}

@keyframes vmnHeroZoom {
    from {
        transform: scale(1.05);
    }

    to {
        transform: scale(1.15);
    }
}

.vmn-hero__overlay {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(1200px 500px at 20% 30%, rgba(37, 90, 168, 0.55), transparent 60%),
        radial-gradient(1000px 500px at 80% 70%, rgba(24, 167, 90, 0.45), transparent 60%),
        linear-gradient(180deg, rgba(6, 15, 32, 0.6) 0%, rgba(6, 15, 32, 0.78) 100%);
}

.vmn-hero__content {
    position: relative;
    padding: 60px 0 80px;
}

.vmn-breadcrumbs {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    font-size: 0.85rem;
    margin-bottom: 24px;
}

.vmn-breadcrumbs a {
    opacity: 0.85;
    transition: opacity 0.2s;
}

.vmn-breadcrumbs a:hover {
    opacity: 1;
}

.vmn-breadcrumbs__separator {
    opacity: 0.5;
}

.vmn-hero__heading {
    font-size: clamp(2.4rem, 5.5vw, 4.4rem);
    line-height: 1.08;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin: 0 0 16px;
}

.vmn-hero__subheading {
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    opacity: 0.9;
    max-width: 58ch;
    margin: 0;
}
    </style>
</head>
<body>
    <!-- 1. HERO SECTION -->
    <section class="vmn-hero">
        <div class="vmn-hero__background" aria-hidden="true"></div>
        <div class="vmn-hero__overlay" aria-hidden="true"></div>
        <div class="vmn-container vmn-hero__content">
            <nav class="vmn-breadcrumbs" aria-label="Breadcrumb navigation">
                <a href="/">Home</a>
                <span class="vmn-breadcrumbs__separator">/</span>
                <span aria-current="page">About Us</span>
            </nav>
            <h1 class="vmn-hero__heading vmn-reveal">
                About <span class="vmn-text-gradient">VIMANA</span>
            </h1>
            <p class="vmn-hero__subheading vmn-reveal" data-delay="80">
                Pioneering advanced chemical solutions and structural protection engineered for durability and lifelong
                waterproofing performance.
            </p>
        </div>
    </section>
</body>
</html>
